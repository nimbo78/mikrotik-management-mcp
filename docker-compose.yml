services:
  mikrotik-management-mcp:
    build: .
    container_name: mikrotik-management-mcp
    restart: unless-stopped
    ports:
      - "8965:8965"
    environment:
      # Optional security:
      # - ALLOWED_TARGETS=192.168.81.0/24,10.0.0.0/8
      # - ALLOWED_CLIENTS=192.168.81.0/24
      # - MCP_AUTH_TOKEN=<your-token>
      - TZ=Europe/Riga
